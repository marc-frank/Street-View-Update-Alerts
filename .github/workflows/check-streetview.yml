name: Check Street View updates

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            echo "::error::Repository secret GOOGLE_MAPS_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${{ secrets.LOCATIONS_JSON }}" ]; then
            echo "::error::Secret LOCATIONS_JSON is not available. Paste your locations JSON (same format as locations.example.json)."
            missing=1
          fi
          email_ok=0
          if [ -n "${{ secrets.SMTP_HOST }}" ] && [ -n "${{ secrets.SMTP_USER }}" ] && [ -n "${{ secrets.SMTP_PASSWORD }}" ] && [ -n "${{ secrets.NOTIFY_EMAIL_TO }}" ]; then
            email_ok=1
          fi
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ] || [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ] || [ -n "${{ secrets.NOTIFY_WEBHOOK_URL }}" ] || [ "$email_ok" -eq 1 ]; then
            :
          else
            echo "::error::No notification channel configured. Add email secrets (SMTP_HOST, SMTP_USER, SMTP_PASSWORD, NOTIFY_EMAIL_TO) and/or a webhook secret."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Street View check
        env:
          LOCATIONS_JSON: ${{ secrets.LOCATIONS_JSON }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          EMAIL_EVERY_RUN: ${{ secrets.EMAIL_EVERY_RUN }}
        run: python check_streetview.py

      # Run even when the check exits 1 (partial location errors). Otherwise
      # state.json is not pushed and successful locations re-alert every run.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json unchanged"
          else
            git commit -m "Update Street View state [skip ci]"
            git push
          fi
